<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<title>Nick's Workout Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0f17; --bg2:#121826; --card:#161d2e; --card2:#1c2438;
    --line:#26304a; --txt:#e8ecf5; --mut:#8a96b0; --mut2:#5c6580;
    --acc:#5b8cff; --acc2:#3d6bff; --good:#37d399; --warn:#ffb02e; --bad:#ff5d6c;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding-bottom:84px;max-width:600px;margin:0 auto;min-height:100vh}
  a{color:var(--acc)}
  .hide{display:none!important}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.3px}
  header .sub{color:var(--mut);font-size:12px;margin-top:2px}
  .page{padding:4px 16px 20px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .stat .n{font-size:26px;font-weight:750;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--mut);margin-top:2px}
  .stat .d{font-size:12px;margin-top:4px;font-weight:600}
  .up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--mut)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:15px}
  .btn{background:var(--acc2);color:#fff;padding:14px 16px;width:100%;font-weight:650;
    box-shadow:0 6px 18px -8px var(--acc2);transition:transform .05s}
  .btn:active{transform:scale(.985)}
  .btn.sec{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--mut);box-shadow:none}
  .btn.sm{padding:9px 12px;width:auto;font-size:13px;border-radius:10px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid #3a2330}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:600;margin:0 8px 8px 0}
  .chip.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
  input,select{font-family:inherit;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 12px;font-size:16px;width:100%;outline:none}
  input:focus,select:focus{border-color:var(--acc)}
  label.fld{display:block;font-size:12px;color:var(--mut);margin:0 0 5px;font-weight:600}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(16,21,34,.92);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;max-width:600px;margin:0 auto;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;color:var(--mut2);display:flex;flex-direction:column;align-items:center;
    gap:3px;font-size:11px;font-weight:600;padding:5px 0}
  nav button.on{color:var(--acc)}
  nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .exh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .exh .nm{font-weight:700;font-size:16px}
  .exh .mg{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .setrow{display:grid;grid-template-columns:34px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}
  .setrow .sn{color:var(--mut);font-size:13px;font-weight:700;text-align:center}
  .setrow .x{color:var(--mut2);text-align:center;font-size:20px;background:none;padding:0}
  .setlbl{display:grid;grid-template-columns:34px 1fr 1fr 36px;gap:8px;font-size:11px;color:var(--mut);
    margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .setlbl span{text-align:center}
  .last{font-size:11px;color:var(--mut2);margin-top:-2px;margin-bottom:8px;padding-left:42px}
  .wk{border-left:3px solid var(--acc2);padding:2px 0 2px 12px;margin-bottom:14px}
  .wk.quick{border-left-color:var(--warn)}
  .qrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .qrow:last-child{border-bottom:none}
  .qrow .qt{margin-left:auto;font-size:12px;color:var(--mut)}
  .qrow .qx{background:none;color:var(--mut2);font-size:19px;padding:0 4px}
  .wk .dt{font-weight:700;font-size:15px}
  .wk .meta{color:var(--mut);font-size:12.5px;margin-top:2px}
  .wk .ex{color:var(--mut);font-size:13px;margin-top:6px;line-height:1.5}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    padding:2px 7px;font-size:11px;margin:2px 4px 2px 0;color:var(--txt)}
  .row{display:flex;gap:10px;align-items:center}
  .sp{justify-content:space-between}
  .muted{color:var(--mut)}
  .center{text-align:center}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--good);color:#06231a;
    padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 10px 30px -10px #000;
    animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;
    animation:rot .8s linear infinite;margin:40px auto}
  @keyframes rot{to{transform:rotate(360deg)}}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;background:none;color:var(--mut);padding:8px;font-size:13px;font-weight:650;border-radius:8px}
  .seg button.on{background:var(--acc2);color:#fff}
  canvas{max-width:100%;display:block}
  .chartbox{position:relative;width:100%;height:220px}
  .chartbox canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important;max-width:none}
  .ovr{position:fixed;inset:0;background:rgba(6,9,16,.6);z-index:50;display:flex;align-items:flex-end;
    justify-content:center;backdrop-filter:blur(3px)}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:600px;
    max-height:80vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .exopt{padding:13px 6px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .exopt .mg{font-size:11px;color:var(--mut)}
  .search{position:sticky;top:0;background:var(--bg2);padding-bottom:10px}
  /* active workout */
  .pbar{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:2px 0 4px}
  .pbar>div{height:100%;background:var(--good);width:0;transition:width .25s}
  .aset{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;background:var(--bg2);cursor:pointer;transition:.12s;user-select:none}
  .aset:active{transform:scale(.99)}
  .aset .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut2);flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;font-size:15px;color:#06231a;font-weight:800}
  .aset .ainfo{font-size:16px;font-weight:600}
  .aset .asn{margin-left:auto;font-size:12px;color:var(--mut)}
  .aset.done{background:rgba(55,211,153,.1);border-color:rgba(55,211,153,.45)}
  .aset.done .ck{background:var(--good);border-color:var(--good)}
  .aset.done .ainfo{color:var(--mut);text-decoration:line-through}
  /* rest timer */
  .restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:40;
    width:calc(100% - 28px);max-width:572px;display:flex;align-items:center;gap:12px;
    background:var(--card2);border:1px solid var(--acc2);border-radius:14px;padding:11px 14px;
    box-shadow:0 14px 34px -12px #000;animation:up .2s ease}
  .restbar.done{border-color:var(--good);background:rgba(55,211,153,.14)}
  .restbar .rtime{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px}
  .restbar.done .rtime{color:var(--good)}
  .restbar .rlbl{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .restbar .rsp{margin-left:auto;display:flex;gap:8px}
  .restbar button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;
    border-radius:10px;font-size:13px;font-weight:600}
  /* meals */
  .daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .daynav button{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:40px;height:40px;border-radius:12px;font-size:18px}
  .daynav .dn{flex:1;text-align:center;font-weight:700;font-size:15px}
  .daynav .dn small{display:block;color:var(--mut);font-weight:500;font-size:12px}
  .wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
  .wkstrip button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:7px 0;font-size:11px;font-weight:600;line-height:1.3}
  .wkstrip button b{display:block;color:var(--txt);font-size:13px}
  .wkstrip button.on{border-color:var(--acc);color:var(--acc)}
  .wkstrip button.on b{color:var(--acc)}
  .kbar{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0 6px}
  .kbar>div{height:100%;background:var(--acc);width:0;transition:width .25s}
  .kbar>div.over{background:var(--bad)}
  .macros{display:flex;gap:14px;font-size:12.5px;color:var(--mut)}
  .macros b{color:var(--txt)}
  .slot{margin-bottom:14px}
  .slot .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .slot .sh h2{margin:0}
  .slot .sh .skc{font-size:12px;color:var(--mut);margin-left:auto;margin-right:10px;font-weight:600}
  .meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .meal:last-child{border-bottom:none}
  .meal .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:#06231a;font-weight:800}
  .meal.eaten .ck{background:var(--good);border-color:var(--good)}
  .meal .mn{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meal .mn small{display:block;color:var(--mut);font-size:12px;font-weight:500}
  .meal .mk{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .meal .mk small{color:var(--mut);font-weight:500;font-size:11px}
  .ropt{padding:11px 6px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
  .ropt .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ropt .rn small{display:block;color:var(--mut);font-size:12px}
  .ropt .rk{font-size:13px;font-weight:700;white-space:nowrap}
  .ropt .rk.none{color:var(--mut2);font-weight:500}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .g4 input{padding:9px 8px;font-size:15px;text-align:center}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<nav id="nav" class="hide">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Log</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 3"/></svg>History</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>Progress</button>
  <button data-tab="meals"><svg viewBox="0 0 24 24"><path d="M3 2v7a3 3 0 0 0 6 0V2"/><path d="M6 12v10"/><path d="M17 2c-2 2-3 5-3 8a3 3 0 0 0 3 3v9"/></svg>Meals</button>
</nav>
<div id="rest" class="restbar hide">
  <div class="rtime" id="rtime">3:00</div>
  <div class="rlbl" id="rlbl">Rest</div>
  <div class="rsp"><button onclick="addRest(30)">+30s</button><button onclick="stopRest()">Skip</button></div>
</div>

<script>
const SUPABASE_URL='https://xemdbsatlbggaszpoivq.supabase.co';
const SUPABASE_KEY='sb_publishable_WP5FED21_Cw4ZaZQEpYqxA_I1GsrO3Z';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ---- Supabase Auth gate ----
function authScreen(){
  app.innerHTML=`<div class="page" style="min-height:88vh;display:flex;flex-direction:column;justify-content:center">
    <div class="card" style="padding:28px 20px">
      <div style="font-size:44px;margin-bottom:6px;text-align:center">\u{1F3CB}\uFE0F</div>
      <div style="font-size:19px;font-weight:750;margin-bottom:16px;text-align:center">Nick's Workout Tracker</div>
      <input id="em" type="email" inputmode="email" autocomplete="username" placeholder="Email" style="margin-bottom:10px">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="margin-bottom:12px">
      <button class="btn" id="sgo">Sign in</button>
      <div id="sgerr" style="margin-top:10px;font-size:13px;color:var(--bad);min-height:16px;text-align:center"></div>
    </div></div>`;
}
async function gate(){
  try{const {data:{session}}=await sb.auth.getSession(); if(session) return;}catch(e){}
  return new Promise(res=>{
    authScreen();
    const go=async()=>{
      const b=document.querySelector('#sgo'),er=document.querySelector('#sgerr');
      const email=document.querySelector('#em').value.trim();
      const password=document.querySelector('#pw').value;
      if(!email||!password){er.textContent='Enter your email and password';return}
      b.disabled=true;b.textContent='Signing in\u2026';er.textContent='';
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error){b.disabled=false;b.textContent='Sign in';er.textContent=error.message;document.querySelector('#pw').value='';return}
      res();
    };
    document.querySelector('#sgo').onclick=go;
    document.querySelector('#em').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#pw').focus()};
    document.querySelector('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
    document.querySelector('#em').focus();
  });
}

const $=s=>document.querySelector(s);
const app=$('#app');
const fmt=n=>n==null?'':(Math.round(n*10)/10).toString();
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const niceDate=d=>{const[y,m,da]=d.split('-');return new Date(y,m-1,da).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const niceDateY=d=>{const[y,m,da]=d.split('-');return new Date(y,m-1,da).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1900)}

const DB={exercises:[],templates:[]};
async function loadCore(){
  const {data:ex}=await sb.from('wt_exercises').select('*').order('name');
  DB.exercises=ex||[];
  const {data:tpl}=await sb.from('wt_templates')
    .select('id,name,position,wt_template_exercises(position,target_sets,target_reps,exercise_id)')
    .order('position');
  DB.templates=(tpl||[]).map(t=>({...t,exs:(t.wt_template_exercises||[]).sort((a,b)=>a.position-b.position)}));
}
function exName(id){const e=DB.exercises.find(x=>x.id===id);return e?e.name:'?'}
function exById(id){return DB.exercises.find(x=>x.id===id)}
async function lastFor(exId){
  const {data}=await sb.from('wt_sets')
    .select('reps,weight,wt_workouts!inner(date)')
    .eq('exercise_id',exId).order('id',{ascending:false}).limit(1);
  if(data&&data[0])return {reps:data[0].reps,weight:data[0].weight,date:data[0].wt_workouts.date};
  return null;
}

let TAB='today';
function setTab(t){TAB=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ({today:renderToday,log:renderLog,history:renderHistory,progress:renderProgress,meals:renderMeals})[t]();window.scrollTo(0,0)}

async function renderToday(){
  app.innerHTML=`<header><div><h1>Today</h1><div class="sub">${niceDateY(todayISO())}</div></div></header>
    <div class="page"><div class="spin"></div></div>`;
  const sinceW=new Date(Date.now()-7*864e5).toLocaleDateString('en-CA');
  const since30=new Date(Date.now()-30*864e5).toLocaleDateString('en-CA');
  const [{data:wks},{data:wmeta},{data:weighs},{count:total},{data:meals}]=await Promise.all([
    sb.from('wt_workouts').select('id,date,name,kind').order('date',{ascending:false}).order('id',{ascending:false}).limit(60),
    sb.from('wt_sets').select('weight,reps,wt_workouts!inner(date)').gte('wt_workouts.date',since30),
    sb.from('wt_weigh_ins').select('date,weight').order('date',{ascending:false}).limit(60),
    sb.from('wt_workouts').select('*',{count:'exact',head:true}).neq('kind','quick'),
    sb.from('wt_meal_plan').select(RSEL).eq('date',todayISO())
  ]);
  let mk=0,me=0,mp=0;(meals||[]).forEach(r=>{const v=mealVals(r);mk+=v.kcal;mp+=v.p;if(r.eaten)me+=v.kcal});const tgt=kcalTarget();
  const real=(wks||[]).filter(w=>w.kind!=='quick');
  const weekCount=real.filter(w=>w.date>=sinceW).length;
  const last=real[0]?real[0].date:null;
  const daysSince=last?Math.floor((new Date(todayISO())-new Date(last))/864e5):null;
  let vol30=0;(wmeta||[]).forEach(s=>{vol30+=(s.weight||0)*(s.reps||0)});
  let wNow=null,wPrev=null,wDelta=null;
  if(weighs&&weighs.length){wNow=weighs[0].weight;const old=weighs.find(x=>x.date<=new Date(Date.now()-14*864e5).toLocaleDateString('en-CA'))||weighs[weighs.length-1];wPrev=old.weight;wDelta=wNow-wPrev}
  const dirCls=d=>d==null?'flat':d<0?'up':d>0?'down':'flat';
  app.innerHTML=`<header><div><h1>Today</h1><div class="sub">${niceDateY(todayISO())}</div></div>
    <button class="btn ghost sm" onclick="lock()" title="Lock">🔒</button></header>
  <div class="page">
    <button class="btn" onclick="setTab('log')" style="margin-bottom:10px">+ Start a workout</button>
    <button class="btn sec" onclick="quickLog()" style="margin-bottom:16px">⚡ Quick log — just did something</button>
    <div class="grid2">
      <div class="stat"><div class="n">${weekCount}</div><div class="l">Workouts this week</div></div>
      <div class="stat"><div class="n">${daysSince==null?'–':daysSince===0?'Today':daysSince+'d'}</div><div class="l">Since last workout</div></div>
      <div class="stat"><div class="n">${total}</div><div class="l">Total sessions logged</div></div>
      <div class="stat"><div class="n">${wNow?fmt(wNow):'–'}<span style="font-size:13px;color:var(--mut)"> lb</span></div>
        <div class="l">Body weight</div>${wDelta!=null?`<div class="d ${dirCls(wDelta)}">${wDelta>0?'+':''}${fmt(wDelta)} lb / 2wk</div>`:''}</div>
    </div>
    <div class="card"><h2>30-day volume</h2>

// ---- Quick log: one-off entry, no workout needed ----
function qRecent(){try{return JSON.parse(localStorage.getItem('wt_qrecent')||'[]')}catch(e){return[]}}
function qRemember(id){const r=qRecent().filter(x=>x!==id);r.unshift(id);localStorage.setItem('wt_qrecent',JSON.stringify(r.slice(0,8)))}
function quickLog(){
  let sel=null;
  const rec=qRecent().map(id=>exById(id)).filter(Boolean).slice(0,6);
  const ov=document.createElement('div');ov.className='ovr';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet">
    <div style="font-size:17px;font-weight:750">⚡ Quick log</div>
    <div class="muted" style="font-size:13px;margin:4px 0 14px">Something you just did — no workout needed.</div>
    <div id="qpick">
      ${rec.length?`<label class="fld">Recent</label><div style="margin-bottom:10px">${rec.map(e=>`<button class="chip qrc" data-ex="${e.id}">${e.name}</button>`).join('')}</div>`:''}
      <label class="fld">Exercise</label>
      <input id="qsearch" placeholder="Search…" autocomplete="off" style="margin-bottom:8px">
      <div id="qlist" style="max-height:230px;overflow:auto"></div>
    </div>
    <div id="qform" class="hide">
      <div class="row sp" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px">
        <div><div style="font-weight:700" id="qname"></div><div class="mg" id="qmg" style="font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px"></div></div>
        <button class="btn ghost sm" id="qchg">Change</button>
      </div>
      <div class="row" style="gap:10px;margin-bottom:12px;align-items:flex-end">
        <div style="flex:1"><label class="fld" id="ql1">Reps</label><input id="qreps" inputmode="decimal" placeholder="e.g. 10"></div>
        <div style="flex:1"><label class="fld" id="ql2">Weight (optional)</label><input id="qw" inputmode="decimal" placeholder="–"></div>
      </div>
      <label class="fld">Date</label>
      <input id="qdate" type="date" value="${todayISO()}" max="${todayISO()}" style="margin-bottom:16px">
      <button class="btn" id="qsave">Log it</button>
    </div>
    <button class="btn ghost" id="qcancel" style="margin-top:8px">Cancel</button>
    <div id="qerr" style="color:var(--bad);font-size:13px;margin-top:8px;min-height:14px"></div>
  </div>`;
  document.body.appendChild(ov);
  const q=s=>ov.querySelector(s);
  const list=q('#qlist');
  function draw(txt=''){
    const t=txt.trim().toLowerCase();
    const hits=DB.exercises.filter(e=>e.name.toLowerCase().includes(t));
    list.innerHTML='';
    if(t&&!DB.exercises.some(e=>e.name.toLowerCase()===t)){
      const d=document.createElement('div');d.className='exopt';
      d.innerHTML=`<span style="color:var(--acc)">+ Create “${txt.trim()}”</span>`;
      d.onclick=()=>createEx(txt.trim());list.appendChild(d);
    }
    hits.forEach(e=>{
      const d=document.createElement('div');d.className='exopt';
      d.innerHTML=`<span>${e.name}</span><span class="mg">${e.muscle_group||''}</span>`;
      d.onclick=()=>choose(e);list.appendChild(d);
    });
  }
  async function createEx(name){
    const mg=prompt('Muscle group (e.g. Chest, Back, Legs, Arms, Shoulders, Core)','Other')||'Other';
    const {data,error}=await sb.from('wt_exercises').insert({name,type:'strength',muscle_group:mg}).select().single();
    if(error){q('#qerr').textContent=error.message;return}
    DB.exercises.push(data);DB.exercises.sort((a,b)=>a.name.localeCompare(b.name));choose(data);
  }
  function choose(e){
    sel=e;
    q('#qpick').classList.add('hide');q('#qform').classList.remove('hide');
    q('#qname').textContent=e.name;q('#qmg').textContent=e.muscle_group||'';
    const cardio=e.type==='cardio';
    q('#ql1').textContent=cardio?'Minutes':'Reps';
    q('#ql2').textContent=cardio?'Dist / Level (optional)':'Weight (optional)';
    q('#qreps').placeholder=cardio?'e.g. 20':'e.g. 10';
    setTimeout(()=>q('#qreps').focus(),60);
  }
  draw();
  ov.querySelectorAll('.qrc').forEach(b=>b.onclick=()=>{const e=exById(+b.dataset.ex);if(e)choose(e)});
  q('#qsearch').oninput=e=>draw(e.target.value);
  q('#qchg').onclick=()=>{sel=null;q('#qform').classList.add('hide');q('#qpick').classList.remove('hide')};
  q('#qcancel').onclick=()=>ov.remove();
  q('#qsave').onclick=async()=>{
    const err=q('#qerr');err.textContent='';
    const a=parseFloat(q('#qreps').value),bRaw=q('#qw').value.trim();
    const b=bRaw===''?null:parseFloat(bRaw);
    const date=q('#qdate').value;
    if(!sel||isNaN(a)||!date){err.textContent='Pick an exercise and enter a number.';return}
    q('#qsave').textContent='Saving…';
    try{
      await saveQuick(sel,a,b,date);
      qRemember(sel.id);
      ov.remove();toast('Logged ⚡');
      if(TAB==='today')renderToday();else if(TAB==='history')renderHistory();
    }catch(e){q('#qsave').textContent='Log it';err.textContent=e.message||'Save failed'}
  };
}
async function saveQuick(ex,a,b,date){
  let {data:found,error:e0}=await sb.from('wt_workouts').select('id').eq('date',date).eq('kind','quick').limit(1);
  if(e0)throw e0;
  let wid;
  if(found&&found.length)wid=found[0].id;
  else{
    const {data:nw,error:e1}=await sb.from('wt_workouts').insert({date,name:'Quick log',kind:'quick'}).select().single();
    if(e1)throw e1;wid=nw.id;
  }
  if(ex.type==='cardio'){
    const {error}=await sb.from('wt_cardio').insert({workout_id:wid,date,exercise_id:ex.id,duration:a,distance:b});
    if(error)throw error;
  }else{
    const {data:lastS}=await sb.from('wt_sets').select('set_number').eq('workout_id',wid).order('set_number',{ascending:false}).limit(1);
    const n=(lastS&&lastS[0]?lastS[0].set_number:0)+1;
    const {error}=await sb.from('wt_sets').insert({workout_id:wid,exercise_id:ex.id,set_number:n,reps:a,weight:b,completed:true});
    if(error)throw error;
  }
}

// ---- Build a new reusable routine from the full exercise catalog ----
let NR_SEL=[];
function newRoutine(){
  NR_SEL=[];
  const groups={};
  DB.exercises.forEach(e=>{(groups[e.muscle_group]=groups[e.muscle_group]||[]).push(e)});
  const order=['Chest','Back','Shoulders','Arms','Legs','Core','Cardio','Other'];
  const gkeys=Object.keys(groups).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  let cat='';
  gkeys.forEach(g=>{
    cat+=`<div class="card"><h2>${g}</h2><div>`;
    groups[g].sort((a,b)=>a.name.localeCompare(b.name)).forEach(e=>{
      cat+=`<button class="chip" data-ex="${e.id}" onclick="toggleNR(${e.id},this)">${e.name}</button>`});
    cat+=`</div></div>`;
  });
  app.innerHTML=`<header><div><h1>New workout</h1><div class="sub">Tap exercises to add</div></div>
    <button class="btn ghost sm" onclick="renderLog()">Cancel</button></header>
  <div class="page">
    <div class="card"><label class="fld">Name (optional)</label><input id="rname" placeholder="My Workout"></div>
    ${cat}
    <div style="height:6px"></div>
    <button class="btn" id="nrsave" onclick="saveRoutine()">Save & start workout (0)</button>
  </div>`;
}
function toggleNR(id,btn){
  const i=NR_SEL.indexOf(id);
  if(i>=0){NR_SEL.splice(i,1);btn.classList.remove('on')}
  else{NR_SEL.push(id);btn.classList.add('on')}
  $('#nrsave').textContent=`Save & start workout (${NR_SEL.length})`;
}
async function saveRoutine(){
  if(!NR_SEL.length){alert('Tap at least one exercise to add.');return}
  let name=($('#rname').value||'').trim();
  if(!name)name='My Workout '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  let base=name,n=2;
  while(DB.templates.some(t=>t.name.toLowerCase()===name.toLowerCase())){name=base+' ('+(n++)+')'}
  const {data:tpl,error}=await sb.from('wt_templates').insert({name,position:DB.templates.length}).select().single();
  if(error){alert('Could not save: '+error.message);return}
  const rows=NR_SEL.map((exId,i)=>({template_id:tpl.id,exercise_id:exId,position:i,target_sets:3,target_reps:8}));
  const {error:e2}=await sb.from('wt_template_exercises').insert(rows);
  if(e2){alert('Could not save exercises: '+e2.message);return}
  await loadCore();
  toast('Routine saved 💾');
  startSession(DB.templates.find(t=>t.id===tpl.id));
}

async function startSession(t){
  SESSION={date:todayISO(),template_id:t?t.id:null,name:t?t.name:'Workout',items:[]};
  if(t){for(const e of t.exs){SESSION.items.push({exId:e.exercise_id,sets:[]})}}
  renderActiveSession();
  for(const it of SESSION.items){const l=await lastFor(it.exId);
    for(let i=0;i<3;i++)it.sets.push({reps:l?l.reps:'',weight:l?l.weight:'',last:l});}
  renderActiveSession();
}
function renderActiveSession(){
  app.innerHTML=`<header><div><h1>${SESSION.name}</h1><div class="sub" id="sdate"></div></div>
    <button class="btn ghost sm" onclick="cancelSession()">Cancel</button></header>
  <div class="page">
    <div class="card"><label class="fld">Date</label><input type="date" id="wdate" value="${SESSION.date}" max="${todayISO()}"></div>
    <div id="items"></div>
    <button class="btn sec" onclick="pickExercise()" style="margin-bottom:14px">+ Add exercise</button>
    <button class="btn" onclick="saveSession()">Save workout</button>
  </div>`;
  $('#wdate').onchange=e=>SESSION.date=e.target.value;
  $('#sdate').textContent=niceDateY(SESSION.date);
  const wrap=$('#items');
  SESSION.items.forEach((it,ii)=>{
    const ex=exById(it.exId);const card=document.createElement('div');card.className='card';
    card.innerHTML=`<div class="exh"><div><div class="nm">${ex?ex.name:'?'}</div><div class="mg">${ex?ex.muscle_group:''}</div></div>
      <button class="btn ghost sm" onclick="removeItem(${ii})" style="color:var(--bad)">Remove</button></div>
      ${it.sets[0]&&it.sets[0].last?`<div class="last">Last: ${fmt(it.sets[0].last.weight)} lb × ${fmt(it.sets[0].last.reps)} · ${niceDate(it.sets[0].last.date)}</div>`:''}
      <div class="setlbl"><span>Set</span><span>${ex&&ex.type==='cardio'?'Min':'Weight'}</span><span>${ex&&ex.type==='cardio'?'Dist/Lvl':'Reps'}</span><span></span></div>
      <div class="srows"></div>
      <div class="row" style="margin-top:6px;gap:8px">
        <button class="btn ghost sm" onclick="addSet(${ii})">+ Add set</button>
        <button class="btn ghost sm" onclick="fillExercise(${ii})" style="color:var(--acc)">⚡ Fill all sets</button>
      </div>`;
    const sr=card.querySelector('.srows');
    it.sets.forEach((s,si)=>{
      const row=document.createElement('div');row.className='setrow';
      row.innerHTML=`<div class="sn">${si+1}</div>
        <input inputmode="decimal" placeholder="–" value="${s.weight??''}" data-i="${ii}" data-s="${si}" data-f="weight">
        <input inputmode="decimal" placeholder="–" value="${s.reps??''}" data-i="${ii}" data-s="${si}" data-f="reps">
        <button class="x" onclick="rmSet(${ii},${si})">×</button>`;
      sr.appendChild(row);
    });
    wrap.appendChild(card);
  });
  wrap.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{
    const{i,s,f}=e.target.dataset;SESSION.items[i].sets[s][f]=e.target.value});
}
function addSet(i){const it=SESSION.items[i];const prev=it.sets[it.sets.length-1]||{};
  it.sets.push({reps:prev.reps||'',weight:prev.weight||'',last:it.sets[0]?it.sets[0].last:null});renderActiveSession()}
function fillExercise(i){const it=SESSION.items[i];
  const src=it.sets.find(s=>s.weight!==''&&s.weight!=null||s.reps!==''&&s.reps!=null);
  if(!src){toast('Enter set 1 first');return}
  it.sets.forEach(s=>{s.weight=src.weight;s.reps=src.reps});
  renderActiveSession();toast('Filled all sets')}
function rmSet(i,s){SESSION.items[i].sets.splice(s,1);renderActiveSession()}
function removeItem(i){SESSION.items.splice(i,1);renderActiveSession()}
function cancelSession(){if(confirm('Discard this workout?')){SESSION=null;renderLog()}}

function pickExercise(){
  const ov=document.createElement('div');ov.className='ovr';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet"><div class="search"><input id="exq" placeholder="Search exercise…" autocomplete="off"><div style="margin-top:10px"><button class="btn ghost sm" id="newex">+ Create new exercise</button></div></div><div id="exlist"></div></div>`;
  document.body.appendChild(ov);
  const list=ov.querySelector('#exlist');
  function draw(q=''){list.innerHTML='';
    DB.exercises.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())).forEach(e=>{
      const d=document.createElement('div');d.className='exopt';
      d.innerHTML=`<span>${e.name}</span><span class="mg">${e.muscle_group}</span>`;
      d.onclick=async()=>{ov.remove();const it={exId:e.id,sets:[]};const l=await lastFor(e.id);
        for(let i=0;i<3;i++)it.sets.push({reps:l?l.reps:'',weight:l?l.weight:'',last:l});
        SESSION.items.push(it);renderActiveSession()};
      list.appendChild(d)})}
  draw();
  ov.querySelector('#exq').oninput=e=>draw(e.target.value);

    const name=q||prompt('Exercise name');if(!name)return;
    const mg=prompt('Muscle group (e.g. Chest, Back, Legs, Arms, Shoulders, Core)','Other')||'Other';
    const {data,error}=await sb.from('wt_exercises').insert({name,type:'strength',muscle_group:mg}).select().single();
    if(error){alert('Could not add: '+error.message);return}
    DB.exercises.push(data);DB.exercises.sort((a,b)=>a.name.localeCompare(b.name));
    ov.remove();const it={exId:data.id,sets:[{reps:'',weight:''},{reps:'',weight:''},{reps:'',weight:''}]};

async function saveSession(){
  const items=SESSION.items.filter(it=>it.sets.some(s=>s.weight!==''||s.reps!==''));
  if(!items.length){alert('Add at least one set before saving.');return}
  const {data:wk,error:e1}=await sb.from('wt_workouts')
    .insert({date:SESSION.date,name:SESSION.name,template_id:SESSION.template_id}).select().single();
  if(e1){alert('Save failed: '+e1.message);return}
  const rows=[];const cardio=[];
  items.forEach(it=>{const ex=exById(it.exId);
    it.sets.forEach((s,i)=>{
      if(s.weight===''&&s.reps==='')return;
      if(ex&&ex.type==='cardio'){cardio.push({workout_id:wk.id,date:SESSION.date,exercise_id:it.exId,
        duration:s.weight===''?null:parseFloat(s.weight),distance:s.reps===''?null:parseFloat(s.reps)})}
      else{rows.push({workout_id:wk.id,exercise_id:it.exId,set_number:i+1,
        reps:s.reps===''?null:parseFloat(s.reps),weight:s.weight===''?null:parseFloat(s.weight)})}
    })});
  if(rows.length)await sb.from('wt_sets').insert(rows);
  if(cardio.length)await sb.from('wt_cardio').insert(cardio);
  SESSION=null;toast('Workout saved 💪');
  if(rows.length)renderActive(wk.id); else setTab('today');
}

// ---- Active workout: tick off each set as you go (persisted) ----
async function renderActive(wid){
  app.innerHTML=`<header><div><h1>In progress</h1><div class="sub">Tap each set as you finish it</div></div>
    <button class="btn ghost sm" onclick="setTab('today')">Finish</button></header><div class="page"><div class="spin"></div></div>`;
  const [{data:w},{data:sets}]=await Promise.all([
    sb.from('wt_workouts').select('*').eq('id',wid).single(),
    sb.from('wt_sets').select('*').eq('workout_id',wid).order('exercise_id').order('set_number')
  ]);
  const byEx={};(sets||[]).forEach(s=>{(byEx[s.exercise_id]=byEx[s.exercise_id]||[]).push(s)});
  let cards='';
  for(const exId in byEx){
    cards+=`<div class="card"><div class="nm" style="font-weight:700;margin-bottom:10px">${exName(+exId)}</div>`;
    byEx[exId].forEach(s=>{
      cards+=`<div class="aset ${s.completed?'done':''}" onclick="toggleSet(${s.id},this)">
        <div class="ck">${s.completed?'✓':''}</div>
        <div class="ainfo">${fmt(s.weight)} lb × ${fmt(s.reps)}</div>
        <div class="asn">Set ${s.set_number}</div></div>`;
    });
    cards+=`</div>`;
  }
  app.innerHTML=`<header><div><h1>${w.name||'Workout'}</h1><div class="sub">Tap each set as you finish it</div></div>
    <button class="btn ghost sm" onclick="setTab('today')">Finish</button></header>
  <div class="page">
    <div class="card" style="position:sticky;top:64px;z-index:5">
      <div class="row sp" style="margin-bottom:6px"><span class="muted" style="font-size:13px;font-weight:600">Progress</span>
        <span id="aprog" style="font-size:13px;font-weight:700"></span></div>
      <div class="pbar"><div id="abar"></div></div>
    </div>
    <div class="card">${restChips()}</div>
    ${cards}
    <button class="btn" onclick="setTab('today')" style="margin-top:6px">Finish workout</button>
  </div>`;
  updateProgress();
}
function updateProgress(){
  const all=document.querySelectorAll('.aset'),done=document.querySelectorAll('.aset.done').length;
  const p=$('#aprog'),b=$('#abar');
  if(p)p.textContent=`${done} / ${all.length} sets`;
  if(b)b.style.width=(all.length?done/all.length*100:0)+'%';
}
async function toggleSet(id,el){
  const now=!el.classList.contains('done');
  el.classList.toggle('done',now);
  el.querySelector('.ck').textContent=now?'✓':'';
  updateProgress();
  if(now){ensureNotify();startRest();}
  const {error}=await sb.from('wt_sets').update({completed:now}).eq('id',id);
  if(error){el.classList.toggle('done',!now);el.querySelector('.ck').textContent=now?'':'✓';updateProgress();toast('Save failed')}
}

const REST_OPTS=[60,90,120,150,180,300];
function restChips(){
  return `<div class="rlbl" style="margin-bottom:8px">Rest length</div><div>`+
    REST_OPTS.map(s=>`<button class="chip rchip ${s===restSecs?'on':''}" data-s="${s}" onclick="setRestLen(${s})">${fmtT(s)}</button>`).join('')+`</div>`;
}
function setRestLen(s){restSecs=s;localStorage.setItem('wt_rest',s);
  document.querySelectorAll('.rchip').forEach(c=>c.classList.toggle('on',+c.dataset.s===s));}
function ensureNotify(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function fmtT(s){const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
function beep(){try{REST.ac=REST.ac||new (window.AudioContext||window.webkitAudioContext)();const ac=REST.ac;
  [0,260,520].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=880;
    o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t/1000;g.gain.setValueAtTime(.0001,s);
    g.gain.exponentialRampToValueAtTime(.4,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);o.start(s);o.stop(s+.22)})}catch(e){}}
// Screen wake lock keeps the screen on during rest so the timer reliably fires
let wantWake=false,wakeLock=null;
async function acquireWake(){wantWake=true;try{if('wakeLock'in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function releaseWake(){wantWake=false;try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(wantWake&&document.visibilityState==='visible')acquireWake()});
function startRest(){
  const bar=$('#rest');bar.classList.remove('hide','done');$('#rlbl').textContent='Rest';
  REST.end=Date.now()+restSecs*1000;
  if(REST.iv)clearInterval(REST.iv);
  try{REST.ac=REST.ac||new (window.AudioContext||window.webkitAudioContext)();if(REST.ac.state==='suspended')REST.ac.resume()}catch(e){}
  acquireWake();
  tickRest();REST.iv=setInterval(tickRest,250);
}
function tickRest(){
  const left=Math.round((REST.end-Date.now())/1000);
  if(left<=0){$('#rtime').textContent='0:00';clearInterval(REST.iv);REST.iv=null;restDone();return}
  $('#rtime').textContent=fmtT(left);
}
function restDone(){
  const bar=$('#rest');bar.classList.add('done');$('#rlbl').textContent='Rest done!';
  beep();try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}
  try{if('Notification'in window&&Notification.permission==='granted')new Notification('Rest over 💪',{body:'Time for your next set',tag:'wt-rest'})}catch(e){}
  releaseWake();
  setTimeout(()=>{if(!REST.iv)$('#rest').classList.add('hide')},10000);
}
function addRest(s){if($('#rest').classList.contains('hide'))return;REST.end=Math.max(Date.now(),REST.end)+s*1000;
  $('#rest').classList.remove('done');$('#rlbl').textContent='Rest';if(!REST.iv)REST.iv=setInterval(tickRest,250);tickRest()}
function stopRest(){if(REST.iv)clearInterval(REST.iv);REST.iv=null;releaseWake();$('#rest').classList.add('hide')}

async function renderHistory(){
  app.innerHTML=`<header><div><h1>History</h1><div class="sub">Every session</div></div></header><div class="page"><div class="spin"></div></div>`;
  const {data:wks}=await sb.from('wt_workouts').select('id,date,name,kind').order('date',{ascending:false}).order('id',{ascending:false});
  const pg=$('.page');pg.innerHTML='';
  if(!wks||!wks.length){pg.innerHTML='<div class="muted center">No workouts yet.</div>';return}
  const {data:allsets}=await sb.from('wt_sets').select('workout_id,exercise_id,reps,weight');
  const byW={};(allsets||[]).forEach(s=>{(byW[s.workout_id]=byW[s.workout_id]||[]).push(s)});
  let curM='';
  wks.forEach(w=>{
    const mk=w.date.slice(0,7);
    if(mk!==curM){curM=mk;const h=document.createElement('h2');h.style.cssText='margin:18px 0 10px;color:var(--mut)';
      h.textContent=new Date(w.date+'T00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});pg.appendChild(h)}
    const s=byW[w.id]||[];
    const vol=s.reduce((a,x)=>a+(x.weight||0)*(x.reps||0),0);
    const card=document.createElement('div');card.className='card';card.style.cursor='pointer';card.onclick=()=>openWorkout(w.id);
    if(w.kind==='quick'){
      const bits=s.map(x=>`${exName(x.exercise_id)} × ${fmt(x.reps)}${x.weight?' @ '+fmt(x.weight)+' lb':''}`);
      card.style.borderColor='#3a3320';
      card.innerHTML=`<div class="row sp"><div class="dt" style="font-weight:700">${niceDate(w.date)} <span style="color:var(--warn);font-size:12px">⚡ Quick log</span></div>
        <div class="muted" style="font-size:12px">${bits.length} entr${bits.length===1?'y':'ies'}</div></div>
        <div class="ex" style="margin-top:8px">${bits.map(n=>`<span class="pill">${n}</span>`).join('')}</div>`;
    }else{
      const names=[...new Set(s.map(x=>exName(x.exercise_id)))];
      card.innerHTML=`<div class="row sp"><div class="dt" style="font-weight:700">${niceDate(w.date)}</div>
        <div class="muted" style="font-size:12px">${s.length} sets · ${Math.round(vol).toLocaleString()} lb</div></div>
        <div class="ex" style="margin-top:8px">${names.map(n=>`<span class="pill">${n}</span>`).join('')}</div>`;
    }
    pg.appendChild(card);
  });
}
async function openWorkout(id){

  const {data:sets}=await sb.from('wt_sets').select('*').eq('workout_id',id).order('exercise_id').order('set_number');
  if((sets||[]).some(s=>!s.completed)){return renderActive(id)}
  const w=w0;
  const {data:cardio}=await sb.from('wt_cardio').select('*').eq('workout_id',id);
  const byEx={};(sets||[]).forEach(s=>{(byEx[s.exercise_id]=byEx[s.exercise_id]||[]).push(s)});
  const ov=document.createElement('div');ov.className='ovr';ov.onclick=e=>{if(e.target===ov)ov.remove()};

    <div class="muted" style="font-size:13px">${w.name||'Workout'}</div></div>

    ss.forEach(s=>{body+=`<div class="row" style="font-size:14px;margin-bottom:4px"><span class="sn" style="width:30px;color:var(--mut)">${s.set_number}</span>
      <span style="font-weight:600">${fmt(s.weight)} lb</span><span class="muted">×</span><span style="font-weight:600">${fmt(s.reps)}</span></div>`});
    body+=`</div>`}

    <div class="muted" style="font-size:14px;margin-top:4px">${fmt(c.duration)} min · ${fmt(c.distance)}</div></div>`});

async function delQuickEntry(kind,id,wid){
  await sb.from(kind==='cardio'?'wt_cardio':'wt_sets').delete().eq('id',id);
  const [{count:cs},{count:cc}]=await Promise.all([
    sb.from('wt_sets').select('*',{count:'exact',head:true}).eq('workout_id',wid),
    sb.from('wt_cardio').select('*',{count:'exact',head:true}).eq('workout_id',wid)
  ]);
  if(!cs&&!cc)await sb.from('wt_workouts').delete().eq('id',wid);
  document.querySelector('.ovr')?.remove();toast('Removed');
  if(TAB==='history')renderHistory();else renderToday();
}
async function delWorkout(id){if(!confirm('Delete this whole workout?'))return;
  await sb.from('wt_cardio').delete().eq('workout_id',id);
  await sb.from('wt_sets').delete().eq('workout_id',id);
  await sb.from('wt_workouts').delete().eq('id',id);
  document.querySelector('.ovr')?.remove();toast('Deleted');renderHistory()}

    byDate[d]=byDate[d]||{top:0,e1rm:0};byDate[d].top=Math.max(byDate[d].top,s.weight||0);byDate[d].e1rm=Math.max(byDate[d].e1rm,e1rm)});
  const dates=Object.keys(byDate).sort();const labels=dates.map(d=>niceDate(d));

    backgroundColor:c=>grad(c.chart.ctx,'#37d399'),fill:true,tension:.3,pointRadius:2,borderWidth:2.5}]},options:chartOpts()});

// ================= MEALS =================
const SLOTS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snacks']];
let MDAY=todayISO();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(d,n)=>{const[y,m,da]=d.split('-');const x=new Date(y,m-1,da);x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')};
const kcalTarget=()=>+(localStorage.getItem('wt_kcal_target')||0);
const RSEL='id,date,slot,recipe_id,custom_name,servings,calories,protein_g,carbs_g,fat_g,eaten,notes,recipes(name,recipe_nutrition(calories,protein_g,carbs_g,fat_g,servings_num))';
// per-entry totals: explicit values win, else recipe_nutrition x servings
const rnOf=m=>{let n=m.recipes&&m.recipes.recipe_nutrition;if(Array.isArray(n))n=n[0];return n||null};
function mealVals(m){
  const n=rnOf(m);
  const pick=k=>m[k]!=null?+m[k]:(n&&n[k]!=null?+n[k]:0);
  const s=+m.servings||1;
  return {name:m.custom_name||(m.recipes&&m.recipes.name)||'Meal',kcal:pick('calories')*s,p:pick('protein_g')*s,c:pick('carbs_g')*s,f:pick('fat_g')*s,known:m.calories!=null||!!(n&&n.calories!=null)};
}
async function loadRecipes(force){
  if(DB.recipes&&!force)return DB.recipes;
  const {data,error}=await sb.from('recipes').select('id,name,category,servings,recipe_nutrition(calories,protein_g,carbs_g,fat_g,fiber_g,servings_num,notes)').order('name');
  if(error){toast('Recipes: '+error.message);DB.recipes=[];return DB.recipes}
  DB.recipes=(data||[]).map(r=>({...r,n:Array.isArray(r.recipe_nutrition)?r.recipe_nutrition[0]:r.recipe_nutrition}));
  return DB.recipes;
}
async function renderMeals(){
  app.innerHTML=`<header><div><h1>Meals</h1><div class="sub">Plan &amp; log what you eat</div></div>
    <button class="btn ghost sm" onclick="setTarget()" title="Daily target">🎯 ${kcalTarget()?kcalTarget().toLocaleString()+' kcal':'Set target'}</button></header>
    <div class="page"><div class="spin"></div></div>`;
  // week strip: Mon..Sun around MDAY
  const [y,m,d]=MDAY.split('-');const dt=new Date(y,m-1,d);const dow=(dt.getDay()+6)%7;
  const wk0=addDays(MDAY,-dow),wk6=addDays(wk0,6);
  const {data:rows,error}=await sb.from('wt_meal_plan').select(RSEL).gte('date',wk0).lte('date',wk6).order('id');
  if(error){app.querySelector('.page').innerHTML=`<div class="card">${esc(error.message)}</div>`;return}
  const byDay={};(rows||[]).forEach(r=>{(byDay[r.date]=byDay[r.date]||[]).push(r)});
  const dayTot=list=>{const t={kcal:0,p:0,c:0,f:0,eaten:0};(list||[]).forEach(r=>{const v=mealVals(r);t.kcal+=v.kcal;t.p+=v.p;t.c+=v.c;t.f+=v.f;if(r.eaten)t.eaten+=v.kcal});return t};
  const strip=[];for(let i=0;i<7;i++){const dd=addDays(wk0,i);const t=dayTot(byDay[dd]);const[yy,mm,da]=dd.split('-');const lab=new Date(yy,mm-1,da).toLocaleDateString('en-US',{weekday:'narrow'});
    strip.push(`<button class="${dd===MDAY?'on':''}" onclick="MDAY='${dd}';renderMeals()">${lab} ${+da}<b>${t.kcal?Math.round(t.kcal):'–'}</b></button>`)}
  const today=byDay[MDAY]||[];const T=dayTot(today);const tgt=kcalTarget();
  const pct=tgt?Math.min(100,Math.round(T.kcal/tgt*100)):0;
  let html=`<div class="daynav"><button onclick="MDAY=addDays(MDAY,-1);renderMeals()">‹</button>
      <div class="dn">${MDAY===todayISO()?'Today':niceDate(MDAY)}<small>${niceDateY(MDAY)}</small></div>
      <button onclick="MDAY=addDays(MDAY,1);renderMeals()">›</button></div>
    <div class="wkstrip">${strip.join('')}</div>
    <div class="card"><div class="row sp"><div><span style="font-size:30px;font-weight:750;letter-spacing:-.5px">${Math.round(T.kcal).toLocaleString()}</span><span style="font-size:13px;color:var(--mut)"> kcal ${tgt?'/ '+tgt.toLocaleString():'planned'}</span></div>
        <div class="muted" style="font-size:12px;text-align:right">${Math.round(T.eaten).toLocaleString()} eaten<br>${tgt?(tgt-T.kcal>=0?Math.round(tgt-T.kcal)+' left':Math.round(T.kcal-tgt)+' over'):''}</div></div>
      ${tgt?`<div class="kbar"><div class="${T.kcal>tgt?'over':''}" style="width:${pct}%"></div></div>`:''}
      <div class="macros"><span>P <b>${Math.round(T.p)}g</b></span><span>C <b>${Math.round(T.c)}g</b></span><span>F <b>${Math.round(T.f)}g</b></span></div></div>`;
  for(const [key,label] of SLOTS){
    const list=today.filter(r=>r.slot===key);const st=dayTot(list);
    html+=`<div class="card slot"><div class="sh"><h2>${label}</h2><span class="skc">${list.length?Math.round(st.kcal)+' kcal':''}</span><button class="btn sec sm" onclick="addMeal('${key}')">+ Add</button></div>
      ${list.length?list.map(r=>{const v=mealVals(r);return `<div class="meal ${r.eaten?'eaten':''}" onclick="openMeal(${r.id})">
        <div class="ck" onclick="event.stopPropagation();toggleEaten(${r.id},${!r.eaten})">${r.eaten?'✓':''}</div>
        <div class="mn">${esc(v.name)}<small>${(+r.servings||1)!==1?fmt(r.servings)+' servings':'1 serving'}${r.recipe_id?' · recipe':''}${!v.known?' · no estimate':''}</small></div>
        <div class="mk">${v.known?Math.round(v.kcal):'?'}<small> kcal</small></div></div>`}).join(''):'<div class="muted" style="font-size:13px">Nothing planned.</div>'}</div>`;
  }
  app.querySelector('.page').innerHTML=html;
}
function setTarget(){
  const ov=document.createElement('div');ov.className='ovr';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet"><div style="font-size:17px;font-weight:750;margin-bottom:14px">Daily calorie target</div>
    <input id="tg" inputmode="numeric" placeholder="e.g. 2200" value="${kcalTarget()||''}" style="margin-bottom:12px">
    <button class="btn" id="tgs">Save</button><button class="btn ghost" id="tgc" style="margin-top:8px">Clear target</button></div>`;
  document.body.appendChild(ov);const inp=ov.querySelector('#tg');setTimeout(()=>inp.focus(),50);
  ov.querySelector('#tgs').onclick=()=>{const v=parseInt(inp.value);if(v>0)localStorage.setItem('wt_kcal_target',v);ov.remove();renderMeals()};
  ov.querySelector('#tgc').onclick=()=>{localStorage.removeItem('wt_kcal_target');ov.remove();renderMeals()};
}
async function toggleEaten(id,val){
  const {error}=await sb.from('wt_meal_plan').update({eaten:val}).eq('id',id);
  if(error){toast(error.message);return}renderMeals();
}
// ---- Add a meal: pick a recipe or type it ----
async function addMeal(slot){
  const ov=document.createElement('div');ov.className='ovr';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet">
    <div class="row sp" style="margin-bottom:10px"><div style="font-size:17px;font-weight:750">Add to ${SLOTS.find(s=>s[0]===slot)[1]}</div>
      <select id="mslot" style="width:auto;padding:8px 10px;font-size:13px">${SLOTS.map(s=>`<option value="${s[0]}" ${s[0]===slot?'selected':''}>${s[1]}</option>`).join('')}</select></div>
    <div class="seg"><button data-m="recipe" class="on">From my recipes</button><button data-m="custom">Type it in</button></div>
    <div id="mbody"><div class="spin"></div></div></div>`;
  document.body.appendChild(ov);
  const body=ov.querySelector('#mbody');let mode='recipe';
  ov.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;ov.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));draw()});
  const curSlot=()=>ov.querySelector('#mslot').value;
  async function draw(){
    if(mode==='recipe'){
      const recs=await loadRecipes();
      body.innerHTML=`<div class="search"><input id="rq" placeholder="Search ${recs.length} recipes…"></div><div id="rlist"></div>`;
      const list=body.querySelector('#rlist');
      const paint=q=>{q=(q||'').toLowerCase().trim();const f=recs.filter(r=>!q||r.name.toLowerCase().includes(q)||(r.category||'').toLowerCase().includes(q)).slice(0,60);
        list.innerHTML=f.length?f.map(r=>`<div class="ropt" data-id="${r.id}"><div class="rn">${esc(r.name)}<small>${esc(r.category||'')}${r.servings?' · '+esc(r.servings):''}</small></div>
          <div class="rk ${r.n?'':'none'}">${r.n?Math.round(r.n.calories)+' kcal':'no estimate'}</div></div>`).join(''):'<div class="muted center" style="padding:20px">No match.</div>';
        list.querySelectorAll('.ropt').forEach(el=>el.onclick=()=>pickRecipe(recs.find(r=>r.id===el.dataset.id)))};
      paint('');body.querySelector('#rq').oninput=e=>paint(e.target.value);setTimeout(()=>body.querySelector('#rq').focus(),50);
    } else {
      body.innerHTML=`<label class="fld">What did you eat?</label>
        <input id="ctext" placeholder="e.g. 2 eggs, 2 toast with butter, coffee" style="margin-bottom:10px">
        <button class="btn sec" id="cest" style="margin-bottom:12px">🤖 Estimate calories</button>
        <div id="cerr" style="color:var(--bad);font-size:13px;min-height:14px;margin-bottom:6px"></div>
        <div id="cnote" class="muted" style="font-size:12px;margin-bottom:8px"></div>
        <label class="fld">Per serving — kcal / protein / carbs / fat (g)</label>
        <div class="g4" style="margin-bottom:10px"><input id="ck" inputmode="numeric" placeholder="kcal"><input id="cp" inputmode="numeric" placeholder="P"><input id="cc" inputmode="numeric" placeholder="C"><input id="cf" inputmode="numeric" placeholder="F"></div>
        <div class="row" style="margin-bottom:14px"><div style="flex:1"><label class="fld">Servings</label><input id="cs" inputmode="decimal" value="1"></div>
          <div style="flex:1"><label class="fld">Date</label><input id="cd" type="date" value="${MDAY}"></div></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px"><input type="checkbox" id="ceat" checked style="width:auto"> Already eaten</label>
        <button class="btn" id="csave">Save</button>`;
      const $q=s=>body.querySelector(s);setTimeout(()=>$q('#ctext').focus(),50);
      $q('#cest').onclick=async()=>{const t=$q('#ctext').value.trim();if(!t){$q('#cerr').textContent='Type what you ate first.';return}
        const b=$q('#cest');b.disabled=true;b.textContent='Estimating…';$q('#cerr').textContent='';
        const r=await estimateNutrition({text:t});b.disabled=false;b.textContent='🤖 Estimate calories';
        if(r.error){$q('#cerr').textContent=r.error;return}
        const e=r.estimate;$q('#ck').value=Math.round(e.calories);$q('#cp').value=Math.round(e.protein_g||0);$q('#cc').value=Math.round(e.carbs_g||0);$q('#cf').value=Math.round(e.fat_g||0);
        $q('#cnote').textContent=e.notes||''};
      $q('#csave').onclick=async()=>{const name=$q('#ctext').value.trim();const kcal=parseFloat($q('#ck').value);
        if(!name){$q('#cerr').textContent='Type what you ate.';return}
        const row={date:$q('#cd').value||MDAY,slot:curSlot(),custom_name:name,servings:parseFloat($q('#cs').value)||1,eaten:$q('#ceat').checked,
          calories:isNaN(kcal)?null:kcal,protein_g:parseFloat($q('#cp').value)||null,carbs_g:parseFloat($q('#cc').value)||null,fat_g:parseFloat($q('#cf').value)||null};
        const {error}=await sb.from('wt_meal_plan').insert(row);if(error){$q('#cerr').textContent=error.message;return}
        ov.remove();toast('Meal added');MDAY=row.date;renderMeals()};
    }
  }
  async function pickRecipe(r){
    body.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:4px">${esc(r.name)}</div>
      <div class="muted" style="font-size:12px;margin-bottom:12px">${esc(r.category||'')}${r.servings?' · recipe makes '+esc(r.servings):''}</div>
      <div id="rn" class="card" style="padding:12px">${r.n?`<div style="font-size:22px;font-weight:750">${Math.round(r.n.calories)}<span style="font-size:12px;color:var(--mut)"> kcal / serving</span></div>
        <div class="macros" style="margin-top:4px"><span>P <b>${Math.round(r.n.protein_g||0)}g</b></span><span>C <b>${Math.round(r.n.carbs_g||0)}g</b></span><span>F <b>${Math.round(r.n.fat_g||0)}g</b></span></div>
        ${r.n.notes?`<div class="muted" style="font-size:12px;margin-top:6px">${esc(r.n.notes)}</div>`:''}`:`<div class="muted" style="font-size:13px;margin-bottom:8px">No calorie estimate yet.</div>`}
        <button class="btn sec sm" id="rest" style="margin-top:8px">🤖 ${r.n?'Re-estimate':'Estimate with AI'}</button><div id="rerr" style="color:var(--bad);font-size:13px;margin-top:6px"></div></div>
      <div class="row" style="margin-bottom:14px"><div style="flex:1"><label class="fld">Servings</label><input id="rs" inputmode="decimal" value="1"></div>
        <div style="flex:1"><label class="fld">Date</label><input id="rd" type="date" value="${MDAY}"></div></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px"><input type="checkbox" id="reat" style="width:auto"> Already eaten</label>
      <button class="btn" id="rsave">Add to plan</button><button class="btn ghost" id="rback" style="margin-top:8px">← Back</button>`;
    const $q=s=>body.querySelector(s);
    $q('#rback').onclick=draw;
    $q('#rest').onclick=async()=>{const b=$q('#rest');b.disabled=true;b.textContent='Estimating…';$q('#rerr').textContent='';
      const res=await estimateNutrition({recipe_id:r.id});
      if(res.error){b.disabled=false;b.textContent='🤖 Try again';$q('#rerr').textContent=res.error;return}
      await loadRecipes(true);pickRecipe(DB.recipes.find(x=>x.id===r.id))};
    $q('#rsave').onclick=async()=>{const row={date:$q('#rd').value||MDAY,slot:curSlot(),recipe_id:r.id,servings:parseFloat($q('#rs').value)||1,eaten:$q('#reat').checked};
      const {error}=await sb.from('wt_meal_plan').insert(row);if(error){$q('#rerr').textContent=error.message;return}
      ov.remove();toast('Added');MDAY=row.date;renderMeals()};
  }
  draw();
}
async function estimateNutrition(payload){
  try{const {data,error}=await sb.functions.invoke('estimate-nutrition',{body:payload});
    if(error){let msg=error.message||'Request failed';try{const ctx=error.context;if(ctx&&ctx.json){const j=await ctx.json();if(j&&j.error)msg=j.error}}catch(e){}return {error:msg}}
    if(data&&data.error)return {error:data.error};return data||{error:'No reply'}}
  catch(e){return {error:e.message||'Request failed'}}
}
// ---- edit / delete an entry ----
async function openMeal(id){
  const {data:m,error}=await sb.from('wt_meal_plan').select(RSEL).eq('id',id).single();
  if(error||!m){toast('Not found');return}
  const v=mealVals(m);const n=rnOf(m);
  const per=k=>m[k]!=null?m[k]:(n&&n[k]!=null?n[k]:'');
  const ov=document.createElement('div');ov.className='ovr';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.innerHTML=`<div class="sheet"><div style="font-size:17px;font-weight:750;margin-bottom:2px">${esc(v.name)}</div>
    <div class="muted" style="font-size:12px;margin-bottom:12px">${m.recipe_id?'From your recipes':'Custom entry'} · ${niceDate(m.date)}</div>
    <label class="fld">Per serving — kcal / protein / carbs / fat (g)${m.recipe_id?' (blank = use recipe estimate)':''}</label>
    <div class="g4" style="margin-bottom:10px"><input id="ek" inputmode="numeric" value="${per('calories')!==''?Math.round(per('calories')):''}" placeholder="kcal"><input id="ep" inputmode="numeric" value="${per('protein_g')!==''?Math.round(per('protein_g')):''}" placeholder="P"><input id="ec" inputmode="numeric" value="${per('carbs_g')!==''?Math.round(per('carbs_g')):''}" placeholder="C"><input id="ef" inputmode="numeric" value="${per('fat_g')!==''?Math.round(per('fat_g')):''}" placeholder="F"></div>
    <div class="row" style="margin-bottom:10px"><div style="flex:1"><label class="fld">Servings</label><input id="es" inputmode="decimal" value="${m.servings}"></div>
      <div style="flex:1"><label class="fld">Slot</label><select id="eslot">${SLOTS.map(s=>`<option value="${s[0]}" ${s[0]===m.slot?'selected':''}>${s[1]}</option>`).join('')}</select></div></div>
    <div class="row" style="margin-bottom:14px"><div style="flex:1"><label class="fld">Date</label><input id="ed" type="date" value="${m.date}"></div>
      <label style="flex:1;display:flex;align-items:center;gap:8px;font-size:14px;margin-top:18px"><input type="checkbox" id="eeat" ${m.eaten?'checked':''} style="width:auto"> Eaten</label></div>
    <button class="btn" id="esave">Save</button>
    <button class="btn danger" id="edel" style="margin-top:8px">Delete</button>
    <div id="eerr" style="color:var(--bad);font-size:13px;margin-top:8px;min-height:14px"></div></div>`;
  document.body.appendChild(ov);const $q=s=>ov.querySelector(s);
  const numOrNull=s=>{const x=parseFloat($q(s).value);return isNaN(x)?null:x};
  $q('#esave').onclick=async()=>{
    const upd={servings:parseFloat($q('#es').value)||1,slot:$q('#eslot').value,date:$q('#ed').value||m.date,eaten:$q('#eeat').checked,
      calories:numOrNull('#ek'),protein_g:numOrNull('#ep'),carbs_g:numOrNull('#ec'),fat_g:numOrNull('#ef')};
    // for recipe rows, values equal to the recipe estimate stay null so a re-estimate flows through
    if(m.recipe_id&&n){for(const k of ['calories','protein_g','carbs_g','fat_g'])if(upd[k]!=null&&n[k]!=null&&Math.round(upd[k])===Math.round(n[k]))upd[k]=null}
    const {error}=await sb.from('wt_meal_plan').update(upd).eq('id',id);if(error){$q('#eerr').textContent=error.message;return}
    ov.remove();toast('Saved');MDAY=upd.date;renderMeals()};
  $q('#edel').onclick=async()=>{const {error}=await sb.from('wt_meal_plan').delete().eq('id',id);if(error){$q('#eerr').textContent=error.message;return}ov.remove();toast('Deleted');renderMeals()};
}

async function lock(){try{await sb.auth.signOut()}catch(e){}localStorage.removeItem('wt_ok');location.reload()}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(async function init(){
  await gate();
  try{await loadCore()}catch(e){
    const perm=/permission denied|row-level security|JWT/i.test(e.message||'');
    app.innerHTML=`<div class="page"><div class="card">${perm?'That account doesn\u2019t have access to the workout data.':'Couldn\u2019t connect to the database.'}<br><span class="muted">${e.message}</span><br><br><button class="btn ghost sm" onclick="lock()">Sign out</button></div></div>`;return}
  $('#nav').classList.remove('hide');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  setTab('today');
})();
</script>
</body>
